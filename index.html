
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080510">
<title>Daily Stake - Multi Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
 --bg:#080510;--panel:#171020;--panel2:#21152f;
 --purple:#922cff;--pink:#e02cff;--green:#00e6a0;
 --red:#ff426d;--text:#fff;--muted:#aa9bb9;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:var(--text);
 font-family:Arial,sans-serif;
 background:
 radial-gradient(ellipse at 12% 5%,#45116b 0,transparent 35%),
 radial-gradient(ellipse at 95% 35%,#29104c 0,transparent 38%),
 radial-gradient(ellipse at 45% 100%,#102c35 0,transparent 40%),
 linear-gradient(145deg,#080510,#10091b 55%,#080510);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{
 position:sticky;top:0;z-index:20;padding:15px;
 background:#10091ced;backdrop-filter:blur(15px);
 border-bottom:1px solid #8f40c344;
}
.brand{font-size:19px;font-weight:900;letter-spacing:1px}
.brand span{color:#c45cff}
.subbrand{font-size:9px;letter-spacing:2px;color:#aa9bb9;margin-top:4px}
.wrap{max-width:1100px;margin:auto;padding:14px}
.panel{
 background:linear-gradient(145deg,#21152fef,#100b19f5);
 border:1px solid #8745b744;border-radius:17px;
 padding:16px;margin-bottom:14px;
 box-shadow:0 12px 35px #0005;
}
h2{font-size:18px;margin:0 0 14px}
h3{font-size:14px;color:#d9b5ff;margin:0 0 12px}
.muted{color:var(--muted);font-size:12px}
input,select,textarea{
 width:100%;padding:13px;border-radius:10px;
 background:#0d0915;color:white;border:1px solid #65427f;
 margin:6px 0 12px;outline:none;
}
input:focus,select:focus,textarea:focus{
 border-color:#c36aff;box-shadow:0 0 0 2px #a52cff22;
}
.btn{
 border:0;border-radius:10px;padding:13px 15px;
 color:white;font-weight:bold;
 background:linear-gradient(100deg,#7625dc,#c32cff);
 box-shadow:0 5px 17px #9b26e533;
 width:100%;margin:5px 0;
}
.btn.green{background:linear-gradient(100deg,#008e68,#00d69b);color:#001b13}
.btn.red{background:linear-gradient(100deg,#a71949,#ff426d)}
.btn.gray{background:#382a45}
.btn.small{width:auto;padding:9px 12px;font-size:11px}
.login{max-width:420px;margin:9vh auto;padding:22px}
.login-logo{text-align:center;font-size:29px;font-weight:900;margin:10px}
.login-logo span{color:#c45cff}
.login-desc{text-align:center;color:#aa9bb9;font-size:11px;letter-spacing:2px;margin-bottom:24px}
.clock{font-size:25px;font-weight:bold;color:#e3c0ff}
.date{font-size:12px;color:#b7a5c8;margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.nav{display:flex;gap:7px;overflow-x:auto;padding:8px 0 14px;scrollbar-width:thin}
.nav button{
 flex:0 0 auto;border:1px solid #7541a355;border-radius:10px;
 padding:11px 13px;background:#21172e;color:#d4c2e1;
 font-size:11px;font-weight:bold;white-space:nowrap;
}
.nav button.active{background:linear-gradient(100deg,#7925df,#d02cff);color:white;border-color:#d58aff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{
 padding:15px;border-radius:14px;
 background:linear-gradient(140deg,#2b1741,#171020);
 border:1px solid #a34cff44;
}
.stat small{font-size:11px;color:#c4b0d5}
.stat b{display:block;font-size:21px;margin-top:8px;overflow-wrap:anywhere}
.stat.green{background:linear-gradient(140deg,#073e35,#10251f)}
.stat.orange{background:linear-gradient(140deg,#482817,#24150f)}
.stat.pink{background:linear-gradient(140deg,#48133f,#241021)}
.stat.blue{background:linear-gradient(140deg,#172a51,#11182b)}
.notice{padding:13px;border-radius:11px;background:#291c39;color:#e3c9ff;font-size:12px;margin:10px 0}
.notice.error{background:#481626;color:#ffb3c4}
.notice.success{background:#073d30;color:#8dffdc}
.section-title{font-size:11px;letter-spacing:1px;color:#c68aff;margin:15px 0 9px}
.item{padding:13px;background:#21172e;border-radius:12px;margin:8px 0;border:1px solid #ffffff12}
.item .muted{margin-top:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.actions button{flex:1}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px;font-size:12px}
th,td{padding:11px 9px;border-bottom:1px solid #ffffff16;text-align:left}
th{color:#d5a5ff;background:#21172e}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:bold}
.approved{background:#064b38;color:#6dffce}
.pending{background:#51370b;color:#ffd77a}
.blocked{background:#54152a;color:#ff8ca8}
.category{
 display:flex;align-items:center;justify-content:space-between;gap:10px;
 padding:13px;border-radius:12px;background:#21172e;margin:8px 0;
 border:1px solid #7541a344;
}
.category label{font-size:13px;font-weight:bold}
.category input{width:130px;margin:0;text-align:right}
.report-paper{
 background:#fff;color:#171020;padding:18px;border-radius:10px;
}
.report-paper h2,.report-paper h3{color:#28113e}
.report-paper table{min-width:0;color:#171020}
.report-paper th{background:#28113e;color:white}
.report-paper td{color:#171020;border-bottom:1px solid #ddd}
.report-paper .report-total{
 margin-top:15px;padding:14px;background:#eee2fa;
 border-radius:8px;font-size:18px;font-weight:bold;
}
footer{text-align:center;color:#756780;font-size:10px;padding:22px}
@media(min-width:650px){
 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
 .login{margin-top:12vh}
}
</style>
</head>

<body>
<header>
 <div class="brand">DAILY STAKE <span>MULTI CENTER</span></div>
 <div class="subbrand">MULTI CENTER MANAGEMENT SYSTEM</div>
</header>

<!-- LOGIN -->
<div id="loginScreen" class="wrap">
 <div class="panel login">
  <div class="login-logo">DAILY <span>STAKE</span></div>
  <div class="login-desc">SECURE CENTER LOGIN</div>

  <label class="muted">Center Name / Admin</label>
  <input id="username" placeholder="Enter center name or admin" autocomplete="username">

  <div id="passwordArea" class="hidden">
   <label class="muted">Admin Password</label>
   <input id="password" type="password" placeholder="Enter admin password">
  </div>

  <button class="btn" onclick="login()">LOGIN</button>
  <button id="changeCenterBtn" class="btn gray hidden" onclick="changeCenter()">CHANGE CENTER</button>
  <div id="loginMessage"></div>
 </div>
</div>

<!-- APP -->
<div id="appScreen" class="hidden">
 <div class="wrap">
  <div class="panel">
   <div class="row">
    <div>
     <div id="welcome" style="font-weight:bold;font-size:17px">Welcome</div>
     <div id="roleText" class="muted"></div>
    </div>
    <button class="btn red small" onclick="logout()">LOG OUT</button>
   </div>
   <div style="margin-top:15px">
    <div id="clock" class="clock">00:00:00</div>
    <div id="businessDate" class="date"></div>
   </div>
  </div>
  <div id="navigation" class="nav"></div>
  <div id="content"></div>
 </div>
</div>

<!-- MAINTENANCE -->
<div id="maintenanceScreen" class="hidden">
 <div class="panel login" style="text-align:center;margin-top:25vh">
  <div style="font-size:48px">⚙️</div>
  <h2>UNDER MAINTENANCE</h2>
  <p class="muted">System is temporarily unavailable.</p>
 </div>
</div>

<footer>DAILY STAKE MULTI CENTER</footer>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwVzKrmNhfTuAfynGQ-Ple1poFp5KH1EqXDwtxF-V9IWVZgPwh6S5JI5vRw5zzscag/exec";

let TOKEN="";
let ROLE="";
let CENTER="";
let ADMIN_DATA=null;
let APPROVED_CENTERS=[];
let CURRENT_PAGE="";
let CHAT_TIMER=null;

const $=id=>document.getElementById(id);
const money=n=>"Rs. "+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function escapeHTML(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function api(action,data={}){
 return new Promise((resolve,reject)=>{
  const callback="ds_cb_"+Date.now()+"_"+Math.floor(Math.random()*999999);
  const params=new URLSearchParams({...data,action,callback});
  const script=document.createElement("script");
  const timer=setTimeout(()=>{cleanup();reject(new Error("Server response timeout"))},20000);
  function cleanup(){
   clearTimeout(timer);
   delete window[callback];
   script.remove();
  }
  window[callback]=result=>{cleanup();resolve(result)};
  script.onerror=()=>{cleanup();reject(new Error("Connection error"))};
  script.src=API_URL+"?"+params.toString();
  document.body.appendChild(script);
 });
}

function deviceId(){
 let id=localStorage.getItem("ds_device_id");
 if(!id){
  id="DS-"+Math.random().toString(36).slice(2)+Date.now();
  localStorage.setItem("ds_device_id",id);
 }
 return id;
}
function deviceName(){
 const ua=navigator.userAgent;
 return ua.includes("iPhone")?"iPhone":ua.includes("Android")?"Android Device":"Web Device";
}

function showLoginMessage(text,type=""){
 $("loginMessage").innerHTML=`<div class="notice ${type}">${escapeHTML(text)}</div>`;
}

function savedCenter(){
 return localStorage.getItem("ds_saved_center")||"";
}

function initialiseLogin(){
 const saved=savedCenter();
 if(saved){
  $("username").value=saved;
  $("username").readOnly=true;
  $("changeCenterBtn").classList.remove("hidden");
 }
}

function changeCenter(){
 $("username").readOnly=false;
 $("username").value="";
 $("username").focus();
 $("changeCenterBtn").classList.add("hidden");
 localStorage.removeItem("ds_saved_center");
 showLoginMessage("Enter the new center name.");
}

$("username").addEventListener("input",()=>{
 const isAdmin=$("username").value.trim().toLowerCase()==="admin";
 $("passwordArea").classList.toggle("hidden",!isAdmin);
});

$("username").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

async function login(){
 const username=$("username").value.trim();
 const password=$("password").value;

 if(!username){showLoginMessage("Enter center name","error");return}
 if(username.toLowerCase()==="admin"&&!password){
  showLoginMessage("Enter admin password","error");return;
 }

 showLoginMessage("Checking login...");

 try{
  const r=await api("login",{
   username:username,
   password:password,
   deviceId:deviceId(),
   deviceName:deviceName()
  });

  if(!r.ok){
   showLoginMessage(r.error||"Login failed","error");
   return;
  }

  TOKEN=r.token;
  ROLE=r.role;
  CENTER=r.center||"";

  if(ROLE==="CENTER_PENDING"){
   localStorage.setItem("ds_saved_center",username);
   $("username").readOnly=true;
   $("changeCenterBtn").classList.remove("hidden");
   showLoginMessage("APPROVAL NOT GRANTED. Admin 2 must approve this center before stake entry.","error");
   return;
  }

  if(ROLE==="CENTER"){
   localStorage.setItem("ds_saved_center",CENTER||username);
   $("username").value=CENTER||username;
   $("username").readOnly=true;
   $("changeCenterBtn").classList.remove("hidden");
  }

  localStorage.setItem("ds_token",TOKEN);
  localStorage.setItem("ds_role",ROLE);
  localStorage.setItem("ds_center",CENTER);

  await startApp();

 }catch(e){
  showLoginMessage(e.message,"error");
 }
}

async function restoreSession(){
 const token=localStorage.getItem("ds_token");
 if(!token)return;

 TOKEN=token;
 try{
  const r=await api("session",{token:TOKEN});
  if(r.maintenance){showMaintenance();return}
  if(!r.ok){clearSession();return}

  ROLE=r.role;
  CENTER=r.center||"";
  if(ROLE==="CENTER_PENDING"){clearSession();return}
  await startApp();
 }catch(e){}
}

function clearSession(){
 TOKEN="";ROLE="";CENTER="";
 localStorage.removeItem("ds_token");
 localStorage.removeItem("ds_role");
 localStorage.removeItem("ds_center");
 $("appScreen").classList.add("hidden");
 $("loginScreen").classList.remove("hidden");
}

async function logout(){
 try{await api("logout",{token:TOKEN})}catch(e){}
 clearSession();
 // Saved center name is deliberately retained after logout.
 initialiseLogin();
}

function showMaintenance(){
 $("loginScreen").classList.add("hidden");
 $("appScreen").classList.add("hidden");
 $("maintenanceScreen").classList.remove("hidden");
}

async function startApp(){
 $("loginScreen").classList.add("hidden");
 $("maintenanceScreen").classList.add("hidden");
 $("appScreen").classList.remove("hidden");

 $("welcome").textContent=ROLE==="ADMIN1"?"MR. HARSHANA":
 ROLE==="ADMIN2"?"MR. PASINDU":CENTER;

 $("roleText").textContent=ROLE==="ADMIN1"?"ADMIN 1 • REPORT ACCESS":
 ROLE==="ADMIN2"?"ADMIN 2 • SYSTEM CONTROL":"CENTER ACCOUNT";

 buildNavigation();

 if(ROLE==="ADMIN2"){
  await loadAdminData();
  openPage("dashboard");
 }else if(ROLE==="ADMIN1"){
  await loadApprovedCenters();
  openPage("reports");
 }else{
  openPage("dashboard");
 }
}

function buildNavigation(){
 let tabs=[];

 if(ROLE==="ADMIN1"){
  tabs=[
   ["reports","📊 REPORTS"],
   ["messages","💬 PRIVATE MESSAGES"]
  ];
 }else if(ROLE==="ADMIN2"){
  // Admin 2 has NO Reports tab.
  tabs=[
   ["dashboard","🏠 DASHBOARD"],
   ["system","⚙️ SYSTEM ACCESS"],
   ["centers","🏢 CENTER MANAGEMENT"],
   ["devices","📱 DEVICES"],
   ["manual","✍️ MANUAL ENTRY"],
   ["requests","📩 OTHER REQUESTS"],
   ["messages","💬 PRIVATE MESSAGES"]
  ];
 }else{
  tabs=[
   ["dashboard","🏠 DASHBOARD"],
   ["newstake","➕ NEW STAKE"],
   ["records","📋 RECORDS"],
   ["messages","💬 MESSAGES"]
  ];
 }

 $("navigation").innerHTML=tabs.map(t=>
  `<button id="nav_${t[0]}" onclick="openPage('${t[0]}')">${t[1]}</button>`
 ).join("");
}

async function openPage(page){
 CURRENT_PAGE=page;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 const active=$("nav_"+page);
 if(active)active.classList.add("active");

 if(CHAT_TIMER){clearInterval(CHAT_TIMER);CHAT_TIMER=null}

 // Enforce role-specific navigation.
 if(ROLE==="ADMIN2"&&page==="reports")return;
 if(ROLE==="ADMIN1"&&!["reports","messages"].includes(page))return;
 if(ROLE==="CENTER"&&!["dashboard","newstake","records","messages"].includes(page))return;

 $("content").innerHTML='<div class="panel muted">Loading...</div>';

 try{
  if(page==="dashboard")await dashboardPage();
  else if(page==="system")await systemPage();
  else if(page==="centers")await centersPage();
  else if(page==="devices")await devicesPage();
  else if(page==="manual")await manualPage();
  else if(page==="requests")await requestsPage();
  else if(page==="reports")await reportsPage();
  else if(page==="newstake")newStakePage();
  else if(page==="records")await recordsPage();
  else if(page==="messages")await messagesPage();
 }catch(e){
  $("content").innerHTML=`<div class="notice error">${escapeHTML(e.message)}</div>`;
 }
}

async function loadAdminData(){
 const r=await api("adminData",{token:TOKEN});
 if(!r.ok)throw new Error(r.error||"Cannot load admin data");
 ADMIN_DATA=r;
}

async function loadApprovedCenters(){
 const r=await api("reportCenters",{token:TOKEN});
 if(!r.ok)throw new Error(r.error||"Cannot load centers");
 APPROVED_CENTERS=r.centers||[];
}

function centerNames(){
 return (ADMIN_DATA?.centers||[]).map(c=>typeof c==="string"?c:c.name).filter(Boolean);
}
function approvedNames(){
 return APPROVED_CENTERS.map(c=>typeof c==="string"?c:c.name).filter(Boolean);
}
function statusTag(status){
 const s=String(status||"PENDING").toUpperCase();
 const cls=s==="APPROVED"?"approved":s==="BLOCKED"?"blocked":"pending";
 return `<span class="tag ${cls}">${escapeHTML(s)}</span>`;
}

function businessDateLocal(){
 const now=new Date();
 const parts=new Intl.DateTimeFormat("en-CA",{
  timeZone:"Asia/Colombo",year:"numeric",month:"2-digit",day:"2-digit",
  hour:"2-digit",hourCycle:"h23"
 }).formatToParts(now);
 const o={};parts.forEach(p=>o[p.type]=p.value);
 let d=new Date(Number(o.year),Number(o.month)-1,Number(o.day));
 if(Number(o.hour)<4)d.setDate(d.getDate()-1);
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayISO(){return businessDateLocal()}

function updateClock(){
 const now=new Date();
 $("clock").textContent=new Intl.DateTimeFormat("en-GB",{
  timeZone:"Asia/Colombo",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"
 }).format(now);
 $("businessDate").textContent="BUSINESS DATE: "+todayISO();
}
setInterval(updateClock,1000);
updateClock();

async function dashboardPage(){
 if(ROLE==="ADMIN2"){
  await loadAdminData();
  const cs=ADMIN_DATA.centers||[];
  const approved=cs.filter(c=>String(c.status).toUpperCase()==="APPROVED").length;
  const pending=cs.filter(c=>String(c.status).toUpperCase()==="PENDING").length;
  const blocked=cs.filter(c=>String(c.status).toUpperCase()==="BLOCKED").length;
  const devices=(ADMIN_DATA.devices||[]).length;

  $("content").innerHTML=`
   <h2>Admin 2 Dashboard</h2>
   <div class="grid">
    <div class="stat"><small>REGISTERED CENTERS</small><b>${cs.length}</b></div>
    <div class="stat green"><small>APPROVED CENTERS</small><b>${approved}</b></div>
    <div class="stat orange"><small>PENDING APPROVALS</small><b>${pending}</b></div>
    <div class="stat pink"><small>BLOCKED CENTERS</small><b>${blocked}</b></div>
    <div class="stat blue"><small>REGISTERED DEVICES</small><b>${devices}</b></div>
    <div class="stat"><small>MAINTENANCE</small><b>${ADMIN_DATA.maintenance?"ON":"OFF"}</b></div>
   </div>
   <div class="panel" style="margin-top:14px">
    <h3>SYSTEM CONTROL</h3>
    <p class="muted">Manage center approvals, devices, maintenance and stake requests.</p>
    <button class="btn" onclick="openPage('system')">OPEN SYSTEM ACCESS</button>
    <button class="btn gray" onclick="openPage('centers')">CENTER MANAGEMENT</button>
    <button class="btn gray" onclick="openPage('devices')">DEVICE MANAGEMENT</button>
   </div>`;
  return;
 }

 if(ROLE==="CENTER"){
  const r=await api("history",{token:TOKEN,center:CENTER,date:todayISO()});
  if(!r.ok)throw new Error(r.error||"Could not load dashboard");
  const rows=r.rows||[];
  const rec=rows.length?rows[rows.length-1]:{};
  $("content").innerHTML=`
   <h2>${escapeHTML(CENTER)} Dashboard</h2>
   <div class="grid">
    <div class="stat green"><small>AUSTRALIAN</small><b>${money(rec.australian)}</b></div>
    <div class="stat orange"><small>ENGLAND</small><b>${money(rec.england)}</b></div>
    <div class="stat pink"><small>TRACKSIDE</small><b>${money(rec.trackside)}</b></div>
    <div class="stat blue"><small>DUE</small><b>${money(rec.due)}</b></div>
   </div>
   <div class="panel" style="margin-top:14px">
    <div class="muted">TODAY'S STAKE TOTAL (Due excluded)</div>
    <div style="font-size:28px;font-weight:bold;color:#72ffcb;margin-top:8px">${money(rec.total)}</div>
    <button class="btn" onclick="openPage('newstake')">ADD NEW STAKE</button>
    <button class="btn gray" onclick="openPage('records')">VIEW RECORDS</button>
   </div>`;
 }
}

async function systemPage(){
 if(ROLE!=="ADMIN2")return;
 await loadAdminData();
 const on=!!ADMIN_DATA.maintenance;

 $("content").innerHTML=`
  <h2>System Access</h2>
  <div class="panel">
   <h3>MAINTENANCE CONTROL</h3>
   <div class="notice ${on?"error":"success"}">
    SYSTEM STATUS: <b>${on?"UNDER MAINTENANCE":"ACTIVE"}</b>
   </div>
   <p class="muted">When maintenance is ON, center users cannot access the system.</p>
   <button class="btn ${on?"green":"red"}" onclick="setMaintenance('${on?"OFF":"ON"}')">
    TURN MAINTENANCE ${on?"OFF":"ON"}
   </button>
  </div>
  <div class="panel">
   <h3>CENTER ACCESS SUMMARY</h3>
   <div class="grid">
    <div class="stat"><small>ALL CENTERS</small><b>${(ADMIN_DATA.centers||[]).length}</b></div>
    <div class="stat green"><small>ACTIVE DEVICES</small><b>${(ADMIN_DATA.devices||[]).length}</b></div>
   </div>
   <button class="btn gray" onclick="openPage('centers')">MANAGE CENTERS</button>
   <button class="btn gray" onclick="openPage('devices')">MANAGE DEVICES</button>
  </div>`;
}

async function setMaintenance(value){
 if(!confirm("Set maintenance "+value+"?"))return;
 const r=await api("maintenance",{token:TOKEN,value});
 if(!r.ok){alert(r.error||"Update failed");return}
 await loadAdminData();
 await systemPage();
}

async function centersPage(){
 if(ROLE!=="ADMIN2")return;
 await loadAdminData();

 const centers=ADMIN_DATA.centers||[];
 $("content").innerHTML=`
  <h2>Center Management</h2>
  <div class="notice">Approve a center before it can enter and save stake.</div>
  <button class="btn gray" onclick="refreshCenters()">REFRESH CENTERS</button>
  <div class="section-title">REGISTERED CENTERS (${centers.length})</div>
  ${centers.length?centers.map(c=>{
   const name=typeof c==="string"?c:c.name;
   const status=typeof c==="string"?"PENDING":c.status;
   return `<div class="item">
    <div class="row"><b>${escapeHTML(name)}</b>${statusTag(status)}</div>
    <div class="muted">Center account</div>
    <div class="actions">
     <button class="btn green small" onclick="approveCenter('${escapeHTML(name)}','APPROVED')">APPROVE</button>
     <button class="btn red small" onclick="approveCenter('${escapeHTML(name)}','BLOCKED')">BLOCK</button>
     <button class="btn gray small" onclick="approveCenter('${escapeHTML(name)}','PENDING')">PENDING</button>

}

 await centersPage();

function amountField(id,label){
 return `<div class="category"><label>${label}</label><input id="${id}" type="number" min="0" step="0.01" placeholder="0.00"></div>`;
}

function newStakePage(){
 if(ROLE!=="CENTER")return;
 $("content").innerHTML=`
  <h2>New Stake</h2>
  <div class="notice success">Center: <b>${escapeHTML(CENTER)}</b> • Business Date: <b>${todayISO()}</b></div>
  <div class="panel">
   ${amountField("australian","🇦🇺 Australian")}
   ${amountField("england","🏴 England")}
   ${amountField("trackside","🏇 Trackside")}
   ${amountField("due","💰 Due")}
   <div class="notice">Due is recorded separately and excluded from the total.</div>
   <button class="btn green" onclick="saveStake()">SAVE STAKE</button>
   <button class="btn gray" onclick="clearStakeFields()">CLEAR</button>
   <div id="saveMessage"></div>
  </div>`;
}

function clearStakeFields(){
 ["australian","england","trackside","due"].forEach(id=>$(id).value="");
}

async function saveStake(){
 if(ROLE!=="CENTER"){alert("Center access only");return}
 const data={
  token:TOKEN,
  australian:$("australian").value||0,
  england:$("england").value||0,
  trackside:$("trackside").value||0,
  due:$("due").value||0
 };
 $("saveMessage").innerHTML='<div class="notice">Saving...</div>';
 try{
  const r=await api("save",data);
  if(!r.ok){
   $("saveMessage").innerHTML=`<div class="notice error">${escapeHTML(r.error||"Save failed. Approval may be required.")}</div>`;
   return;
  }
  $("saveMessage").innerHTML='<div class="notice success">Stake saved successfully.</div>';
  clearStakeFields();
 }catch(e){
  $("saveMessage").innerHTML=`<div class="notice error">${escapeHTML(e.message)}</div>`;
 }
}

async function recordsPage(){
 if(ROLE!=="CENTER")return;

  <button class="btn" onclick="loadRecords()">VIEW RECORDS</button>
  <div id="recordsResult"></div>`;

}

async function loadRecords(){
 const date=$("recordDate").value;
 const r=await api("history",{token:TOKEN,center:CENTER,date});
 if(!r.ok){$("recordsResult").innerHTML=`<div class="notice error">${escapeHTML(r.error||"Could not load records")}</div>`;return}
 const rows=r.rows||[];
 $("recordsResult").innerHTML=rows.length?`
  <div class="panel">
   <h3>${escapeHTML(CENTER)} • ${escapeHTML(date)}</h3>
   <div class="tablewrap"><table>
    <tr><th>Category</th><th>Amount</th></tr>
    <tr><td>Australian</td><td>${money(rows[0].australian)}</td></tr>
    <tr><td>England</td><td>${money(rows[0].england)}</td></tr>
    <tr><td>Trackside</td><td>${money(rows[0].trackside)}</td></tr>
    <tr><td>Due</td><td>${money(rows[0].due)}</td></tr>
   </table></div>
   <div class="report-total">Total (Due excluded): ${money(rows[0].total)}</div>
  </div>`:'<div class="notice">No records found for this date.</div>';
}

async function loadReport(){
 if(ROLE!=="ADMIN1")return;
 const date=$("reportDate").value;
 const center=$("reportCenter").value;
 const r=await api("report",{token:TOKEN,date,center});
 if(!r.ok){
  $("reportResult").innerHTML=`<div class="notice error">${escapeHTML(r.error||"Report loading failed")}</div>`;
  return;
 }

 const rows=r.rows||[];
 const totals=r.totals||{};
 const resultRows=rows.map(x=>`
  <tr>
   <td>${escapeHTML(x.center||x.name||"")}</td>
   <td>${money(x.australian)}</td>
   <td>${money(x.england)}</td>
   <td>${money(x.trackside)}</td>
   <td>${money(x.due)}</td>
   <td><b>${money(x.total)}</b></td>
  </tr>`).join("");

 $("reportResult").innerHTML=`
  <div class="panel">
   <div class="row">
    <h3>REPORT PREVIEW</h3>
    <button class="btn green small" onclick="takeReportScreenshot()">📸 TAKE SCREENSHOT</button>
   </div>
   <div id="reportCapture" class="report-paper">
    <div style="text-align:center;margin-bottom:15px">
     <h2 style="margin:0">DAILY STAKE REPORT</h2>
     <div style="font-size:12px">MULTI CENTER MANAGEMENT SYSTEM</div>
    </div>
    <p><b>Business Date:</b> ${escapeHTML(date)}</p>
    <p><b>Center:</b> ${escapeHTML(center==="ALL"?"ALL CENTERS":center)}</p>
    <div style="overflow-x:auto">
     <table>
      <tr><th>Center</th><th>Australian</th><th>England</th><th>Trackside</th><th>Due</th><th>Total</th></tr>
      ${resultRows||'<tr><td colspan="6">No report data</td></tr>'}
     </table>
    </div>
    <div class="report-total">
     GRAND TOTAL (DUE EXCLUDED): ${money(totals.total)}
    </div>
    <div style="font-size:10px;color:#666;margin-top:18px;text-align:center">
     DAILY STAKE • ${escapeHTML(date)}
    </div>
   </div>
  </div>`;
}

async function takeReportScreenshot(){
 if(ROLE!=="ADMIN1")return;
 const target=$("reportCapture");
 if(!target){alert("Load a report first.");return}
 if(!window.html2canvas){alert("Screenshot tool could not load. Check your internet connection.");return}
 try{
  const canvas=await html2canvas(target,{scale:2,backgroundColor:"#ffffff",useCORS:true});
  const link=document.createElement("a");
  link.download="Daily-Stake-Report-"+$("reportDate").value+".png";
  link.href=canvas.toDataURL("image/png");
  link.click();
 }catch(e){
  alert("Screenshot failed: "+e.message);
 }
}

async function enterRequest(id,center,date,australian,england,trackside,due){
 if(!confirm("Save this request as stake for "+center+"?"))return;
 const r=await api("manualSave",{
  token:TOKEN,center,date,australian,england,trackside,due
 });
 if(!r.ok){alert(r.error||"Could not save request");return}
 const marked=await api("markRequestEntered",{token:TOKEN,id});
 if(!marked.ok){alert("Stake saved, but request status could not be updated: "+(marked.error||""));return}
 alert("Request stake saved.");
 await requestsPage();
}

/* PRIVATE MESSAGES */
async function messagesPage(){
 const isAdmin=ROLE==="ADMIN1"||ROLE==="ADMIN2";
 if(isAdmin){
  if(ROLE==="ADMIN2")await loadAdminData();
  else await loadApprovedCenters();

  const names=ROLE==="ADMIN2"?centerNames():approvedNames();
  $("content").innerHTML=`
   <h2>Private Messages</h2>
   <label class="muted">Select Center</label>
   <select id="chatCenter" onchange="loadMessages()">
    ${names.map(n=>`<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join("")}
   </select>
   <div id="chatArea"></div>`;
 }else{
  $("content").innerHTML=`
   <h2>Private Messages</h2>
   <div class="notice">Send a private message to Admin 1 or Admin 2.</div>
   <label class="muted">Send To</label>
   <select id="chatTarget">
    <option value="ADMIN1">Admin 1</option>
    <option value="ADMIN2">Admin 2</option>
   </select>
   <div id="chatArea"></div>`;
 }
 await loadMessages();
 CHAT_TIMER=setInterval(()=>loadMessages(true),10000);
}

async function loadMessages(silent=false){
 const isAdmin=ROLE==="ADMIN1"||ROLE==="ADMIN2";
 let center=isAdmin?($("chatCenter")?.value||""):CENTER;
 const r=await api("chatGet",{token:TOKEN,center});
 if(!r.ok){
  if(!silent)$("chatArea").innerHTML=`<div class="notice error">${escapeHTML(r.error||"Messages unavailable")}</div>`;
  return;
 }
 const msgs=r.messages||[];
 const html=msgs.map(m=>`
  <div class="item">
   <b>${escapeHTML(m.sender||m.from||"Message")}</b>
   <div style="margin-top:6px">${escapeHTML(m.message||m.text||"")}</div>
   <div class="muted">${escapeHTML(m.time||m.date||"")}</div>
  </div>`).join("");

 $("chatArea").innerHTML=`
  <div class="panel" style="max-height:340px;overflow:auto">${html||'<div class="muted">No messages yet.</div>'}</div>
  <textarea id="chatMessage" rows="3" placeholder="Type your message..."></textarea>
  <button class="btn" onclick="sendMessage()">SEND MESSAGE</button>`;
}

async function sendMessage(){
 const message=$("chatMessage").value.trim();
 if(!message)return;
 const isAdmin=ROLE==="ADMIN1"||ROLE==="ADMIN2";
 const data={token:TOKEN,message};
 if(isAdmin){
  data.center=$("chatCenter").value;
  data.target="CENTER";
 }else{
  data.target=$("chatTarget").value;
 }
 const r=await api("chatSend",data);
 if(!r.ok){alert(r.error||"Message could not be sent");return}
 await loadMessages();
}
