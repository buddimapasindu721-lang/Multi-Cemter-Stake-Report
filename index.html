
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05040D">
<title>Daily Stake - Multi Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
:root{
 --bg:#05040d;--panel:#100d1d;--panel2:#191329;
 --purple:#9b45ff;--pink:#ff3dba;--green:#00e6a0;
 --text:#fff;--muted:#a99bbd;
}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:var(--text);font-family:Arial,sans-serif;
 background:
 radial-gradient(ellipse at 10% 0%,#321052 0,transparent 34%),
 radial-gradient(ellipse at 100% 30%,#211047 0,transparent 35%),
 radial-gradient(ellipse at 50% 100%,#092a2b 0,transparent 42%),
 linear-gradient(145deg,#05040d,#0b0816 55%,#05040d);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{
 position:sticky;top:0;z-index:20;padding:14px 16px;
 background:#090713ed;backdrop-filter:blur(18px);
 border-bottom:1px solid #a34aff40;
}
.brand{font-size:19px;font-weight:900;letter-spacing:1px}
.brand span{color:#c77aff}
.subbrand{font-size:9px;letter-spacing:2px;color:#a99bbd;margin-top:4px}
.wrap{max-width:1000px;margin:auto;padding:13px}
.panel{
 background:linear-gradient(145deg,#1b1429f2,#0e0a18f5);
 border:1px solid #8e4acb45;border-radius:17px;
 padding:15px;margin-bottom:13px;
 box-shadow:0 12px 35px #0007;
}
h2{font-size:18px;margin:0 0 14px}
h3{font-size:13px;color:#e0c2ff;margin:0 0 12px}
.muted{color:var(--muted);font-size:12px}
label.muted{display:block;margin-top:7px}
input,select,textarea{
 width:100%;padding:13px;border-radius:10px;
 background:#0b0813;color:white;border:1px solid #59416f;
 margin:6px 0 12px;outline:none;
}
input:focus,select:focus,textarea:focus{
 border-color:#c77aff;box-shadow:0 0 0 2px #a52cff25;
}
.btn{
 border:0;border-radius:11px;padding:13px 15px;color:white;
 font-weight:bold;background:linear-gradient(110deg,#6520c9,#b52bff);
 box-shadow:0 5px 18px #9b26e533;width:100%;margin:5px 0;
}
.btn.green{background:linear-gradient(110deg,#007e62,#00d9a0);color:#001b13}
.btn.red{background:linear-gradient(110deg,#94133f,#f33b71)}
.btn.gray{background:linear-gradient(110deg,#30243d,#49355c)}
.btn.small{width:auto;padding:9px 12px;font-size:11px}
.login{max-width:420px;margin:9vh auto;padding:22px}
.login-logo{text-align:center;font-size:29px;font-weight:900;margin:10px}
.login-logo span{color:#c77aff}
.login-desc{text-align:center;color:#a99bbd;font-size:11px;letter-spacing:2px;margin-bottom:24px}
.clock{font-size:27px;font-weight:900;color:#e6c7ff;letter-spacing:2px}
.date{font-size:12px;color:#c3afd8;margin-top:5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.nav{display:flex;gap:7px;overflow-x:auto;padding:8px 0 14px;scrollbar-width:thin}
.nav button{
 flex:0 0 auto;border:1px solid #7541a355;border-radius:10px;
 padding:11px 13px;background:#1b1428;color:#d4c2e1;
 font-size:11px;font-weight:bold;white-space:nowrap;
}
.nav button.active{background:linear-gradient(110deg,#6720c9,#ce37ff);color:white;border-color:#d58aff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.stat{padding:15px;border-radius:14px;background:linear-gradient(140deg,#2b1741,#171020);border:1px solid #a34cff44}
.stat small{font-size:10px;color:#c4b0d5}
.stat b{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}
.notice{padding:13px;border-radius:11px;background:#291c39;color:#e3c9ff;font-size:12px;margin:10px 0}
.notice.error{background:#481626;color:#ffb3c4}
.notice.success{background:#073d30;color:#8dffdc}
.section-title{font-size:11px;letter-spacing:1px;color:#c68aff;margin:15px 0 9px}
.item{padding:13px;background:#171126;border-radius:12px;margin:8px 0;border:1px solid #ffffff15}
.item .muted{margin-top:5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.actions button{flex:1}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:500px;font-size:12px}
th,td{padding:11px 9px;border-bottom:1px solid #ffffff16;text-align:left}
th{color:#e2baff;background:#21172e}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:bold}
.approved{background:#064b38;color:#6dffce}
.pending{background:#51370b;color:#ffd77a}
.blocked{background:#54152a;color:#ff8ca8}
.category-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;
 margin:12px 0;
}
.category-card{
 min-width:0;min-height:112px;padding:13px 11px;
 border-radius:15px;border:1px solid;
 display:flex;flex-direction:column;justify-content:space-between;
 box-shadow:inset 0 1px 0 #ffffff15,0 9px 20px #0005;
}
.category-card .cat-name{font-size:12px;font-weight:900;letter-spacing:.4px}
.category-card .cat-icon{font-size:20px;margin-bottom:8px}
.category-card input{
 margin:12px 0 0;padding:11px 8px;text-align:center;
 font-size:17px;font-weight:bold;background:#05040d99;
 border:1px solid currentColor;color:white;border-radius:9px;
 width:100%;
}
.category-card .amount{
 font-size:19px;font-weight:900;margin-top:13px;overflow-wrap:anywhere;
}
.cat-australian{color:#f5c76b;border-color:#9c692c;background:linear-gradient(145deg,#493015,#1c120b 80%)}
.cat-england{color:#85baff;border-color:#376cba;background:linear-gradient(145deg,#172e58,#0b1328 85%)}
.cat-trackside{color:#ff8bd5;border-color:#a63880;background:linear-gradient(145deg,#4c1742,#200d25 85%)}
.cat-due{color:#65f2d9;border-color:#208f85;background:linear-gradient(145deg,#10443e,#0a201f 85%)}
.cat-total{color:#f2d28b;border-color:#9e73db;background:linear-gradient(145deg,#38205b,#171027 85%)}
.cat-total .amount{font-size:23px;color:#ffe2a0}
.report-head{
 padding:15px;border-radius:14px;background:linear-gradient(120deg,#25133f,#101021);
 border:1px solid #8b4ad655;margin-bottom:12px;
}
.report-capture{
 padding:14px;border-radius:16px;background:linear-gradient(145deg,#090711,#151027);
 border:1px solid #9c6bd866;
}
.report-capture .report-head{text-align:center}
.report-capture .report-head h2{margin:0;color:#f1d5ff}
.report-capture .report-head div{font-size:10px;color:#bca4d7;margin-top:5px}
.screenshot-btn{background:linear-gradient(110deg,#5420b6,#b12cff);border:1px solid #d49aff;color:white}
footer{text-align:center;color:#756780;font-size:10px;padding:22px}
@media(min-width:650px){
 .wrap{padding:18px}
 .login{margin-top:12vh}
 .category-grid{gap:14px}
 .category-card{min-height:130px;padding:16px}
 .category-card .cat-name{font-size:14px}
 .category-card input{font-size:19px}
}
</style>
</head>
<body>

<header>
 <div class="brand">DAILY STAKE <span>MULTI CENTER</span></div>
 <div class="subbrand">MULTI CENTER MANAGEMENT SYSTEM</div>
</header>

<div id="loginScreen" class="wrap">
 <div class="panel login">
  <div class="login-logo">DAILY <span>STAKE</span></div>
  <div class="login-desc">SECURE CENTER LOGIN</div>
  <label class="muted">Center Name / Admin</label>
  <input id="username" placeholder="Enter center name or admin" autocomplete="username">
  <div id="passwordArea" class="hidden">
   <label class="muted">Admin Password</label>
   <input id="password" type="password" placeholder="Enter admin password">
  </div>
  <button class="btn" onclick="login()">LOGIN</button>
  <button id="changeCenterBtn" class="btn gray hidden" onclick="changeCenter()">CHANGE CENTER</button>
  <div id="loginMessage"></div>
 </div>
</div>

<div id="appScreen" class="hidden">
 <div class="wrap">
  <div class="panel">
   <div class="row">
    <div>
     <div id="welcome" style="font-weight:bold;font-size:17px">Welcome</div>
     <div id="roleText" class="muted"></div>
    </div>
    <button class="btn red small" onclick="logout()">LOG OUT</button>
   </div>
   <div style="margin-top:15px">
    <div id="clock" class="clock">00:00:00</div>
    <div id="businessDate" class="date"></div>
   </div>
  </div>
  <div id="navigation" class="nav"></div>
  <div id="content"></div>
 </div>
</div>

<div id="maintenanceScreen" class="hidden">
 <div class="panel login" style="text-align:center;margin-top:25vh">
  <div style="font-size:48px">⚙️</div>
  <h2>UNDER MAINTENANCE</h2>
  <p class="muted">System is temporarily unavailable.</p>
 </div>
</div>

<footer>DAILY STAKE MULTI CENTER</footer>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwVzKrmNhfTuAfynGQ-Ple1poFp5KH1EqXDwtxF-V9IWVZgPwh6SJI5vRw5zzscag/exec";

let TOKEN="",ROLE="",CENTER="",ADMIN_DATA=null,APPROVED_CENTERS=[];
let CURRENT_PAGE="",CHAT_TIMER=null,REPORT_TIMER=null;
let apiBusy=false;

const $=id=>document.getElementById(id);
const money=n=>"Rs. "+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function escapeHTML(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function api(action,data={}){
 return new Promise((resolve,reject)=>{
  const callback="ds_cb_"+Date.now()+"_"+Math.floor(Math.random()*999999);
  const params=new URLSearchParams({...data,action,callback});
  const script=document.createElement("script");
  const timer=setTimeout(()=>{cleanup();reject(new Error("Server response timeout"))},25000);
  function cleanup(){clearTimeout(timer);delete window[callback];script.remove()}
  window[callback]=result=>{cleanup();resolve(result)};
  script.onerror=()=>{cleanup();reject(new Error("Connection error"))};
  script.src=API_URL+"?"+params.toString();
  document.body.appendChild(script);
 });
}

function deviceId(){
 let id=localStorage.getItem("ds_device_id");
 if(!id){
  id="DS-"+Math.random().toString(36).slice(2)+Date.now();
  localStorage.setItem("ds_device_id",id);
 }
 return id;
}
function deviceName(){
 const ua=navigator.userAgent;
 return ua.includes("iPhone")?"iPhone":ua.includes("Android")?"Android Device":"Web Device";
}
function showLoginMessage(text,type=""){
 $("loginMessage").innerHTML=`<div class="notice ${type}">${escapeHTML(text)}</div>`;
}
function savedCenter(){return localStorage.getItem("ds_saved_center")||""}

function initialiseLogin(){
 const saved=savedCenter();
 if(saved){
  $("username").value=saved;
  $("username").readOnly=true;
  $("changeCenterBtn").classList.remove("hidden");
 }
}

function changeCenter(){
 $("username").readOnly=false;
 $("username").value="";
 $("username").focus();
 $("changeCenterBtn").classList.add("hidden");
 localStorage.removeItem("ds_saved_center");
 showLoginMessage("Enter the new center name.");
}

$("username").addEventListener("input",()=>{
 $("passwordArea").classList.toggle("hidden",$("username").value.trim().toLowerCase()!=="admin");
});
$("username").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

async function login(){
 const username=$("username").value.trim(),password=$("password").value;
 if(!username){showLoginMessage("Enter center name.","error");return}
 if(username.toLowerCase()==="admin"&&!password){showLoginMessage("Enter admin password.","error");return}

 showLoginMessage("Checking login...");

 try{
  const r=await api("login",{
   username,password,deviceId:deviceId(),deviceName:deviceName()
  });

  if(!r.ok){
   if(r.pending){
    localStorage.setItem("ds_saved_center",username);
    $("username").value=username;
    $("username").readOnly=true;
    $("changeCenterBtn").classList.remove("hidden");
   }
   if(r.maintenance){showMaintenance();return}
   showLoginMessage(r.error||"Login failed.","error");
   return;
  }

  TOKEN=r.token;ROLE=r.role;CENTER=r.center||"";

  if(ROLE==="CENTER"){
   localStorage.setItem("ds_saved_center",CENTER);
   $("username").value=CENTER;
   $("username").readOnly=true;
   $("changeCenterBtn").classList.remove("hidden");
  }

  localStorage.setItem("ds_token",TOKEN);
  localStorage.setItem("ds_role",ROLE);
  localStorage.setItem("ds_center",CENTER);
  await startApp();
 }catch(e){showLoginMessage(e.message,"error")}
}

async function restoreSession(){
 const token=localStorage.getItem("ds_token");
 if(!token)return;

 TOKEN=token;
 try{
  const r=await api("session",{token:TOKEN});
  if(r.maintenance){showMaintenance();return}
  if(!r.ok){clearSession();return}
  ROLE=r.role;CENTER=r.center||"";
  await startApp();
 }catch(e){clearSession()}
}

function clearSession(){
 TOKEN="";ROLE="";CENTER="";
 localStorage.removeItem("ds_token");
 localStorage.removeItem("ds_role");
 localStorage.removeItem("ds_center");
 $("appScreen").classList.add("hidden");
 $("loginScreen").classList.remove("hidden");
}

async function logout(){
 try{await api("logout",{token:TOKEN})}catch(e){}
 clearSession();
 initialiseLogin();
}

function showMaintenance(){
 $("loginScreen").classList.add("hidden");
 $("appScreen").classList.add("hidden");
 $("maintenanceScreen").classList.remove("hidden");
}

function businessDateLocal(){
 const parts=new Intl.DateTimeFormat("en-CA",{
  timeZone:"Asia/Colombo",year:"numeric",month:"2-digit",day:"2-digit",
  hour:"2-digit",hourCycle:"h23"
 }).formatToParts(new Date());

 const o={};
 parts.forEach(p=>o[p.type]=p.value);

 let d=new Date(Date.UTC(Number(o.year),Number(o.month)-1,Number(o.day)));
 if(Number(o.hour)<4)d.setUTCDate(d.getUTCDate()-1);
 return d.toISOString().slice(0,10);
}
function todayISO(){return businessDateLocal()}

function updateClock(){
 const now=new Date();
 $("clock").textContent=new Intl.DateTimeFormat("en-GB",{
  timeZone:"Asia/Colombo",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"
 }).format(now);
 $("businessDate").textContent="BUSINESS DATE: "+todayISO();
}
setInterval(updateClock,1000);
updateClock();

async function startApp(){
 $("loginScreen").classList.add("hidden");
 $("maintenanceScreen").classList.add("hidden");
 $("appScreen").classList.remove("hidden");

 $("welcome").textContent=ROLE==="ADMIN1"?"MR. HARSHANA":
  ROLE==="ADMIN2"?"MR. PASINDU":CENTER;

 $("roleText").textContent=ROLE==="ADMIN1"?"ADMIN 1 • REPORT ACCESS":
  ROLE==="ADMIN2"?"ADMIN 2 • SYSTEM CONTROL":"APPROVED CENTER ACCOUNT";

 buildNavigation();

 // Avoid duplicate data requests during first page load.
 if(ROLE==="ADMIN2")openPage("dashboard");
 else if(ROLE==="ADMIN1")openPage("reports");
 else openPage("dashboard");
}

function buildNavigation(){
 let tabs=[];

 if(ROLE==="ADMIN1"){
  tabs=[["reports","📊 REPORTS"],["messages","💬 PRIVATE MESSAGES"]];
 }else if(ROLE==="ADMIN2"){
  tabs=[
   ["dashboard","🏠 DASHBOARD"],["system","⚙️ SYSTEM ACCESS"],
   ["centers","🏢 CENTER MANAGEMENT"],["devices","📱 DEVICES"],
   ["manual","✍️ MANUAL ENTRY"],["requests","📩 OTHER REQUESTS"],
   ["messages","💬 PRIVATE MESSAGES"]
  ];
 }else{
  tabs=[
   ["dashboard","🏠 DASHBOARD"],["newstake","➕ NEW STAKE"],
   ["records","📋 RECORDS"],["messages","💬 MESSAGES"]
  ];
 }

 $("navigation").innerHTML=tabs.map(t=>
  `<button id="nav_${t[0]}" onclick="openPage('${t[0]}')">${t[1]}</button>`
 ).join("");
}

async function openPage(page){
 CURRENT_PAGE=page;

 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 const active=$("nav_"+page);
 if(active)active.classList.add("active");

 if(CHAT_TIMER){clearInterval(CHAT_TIMER);CHAT_TIMER=null}
 if(REPORT_TIMER){clearInterval(REPORT_TIMER);REPORT_TIMER=null}

 if(ROLE==="ADMIN2"&&["reports","newstake","records"].includes(page))return;
 if(ROLE==="ADMIN1"&&!["reports","messages"].includes(page))return;
 if(ROLE==="CENTER"&&!["dashboard","newstake","records","messages"].includes(page))return;

 $("content").innerHTML='<div class="panel muted">Loading...</div>';

 try{
  if(page==="dashboard")await dashboardPage();
  else if(page==="system")await systemPage();
  else if(page==="centers")await centersPage();
  else if(page==="devices")await devicesPage();
  else if(page==="manual")await manualPage();
  else if(page==="requests")await requestsPage();
  else if(page==="reports")await reportsPage();
  else if(page==="newstake")await newStakePage();
  else if(page==="records")await recordsPage();
  else if(page==="messages")await messagesPage();
 }catch(e){
  $("content").innerHTML=`<div class="notice error">${escapeHTML(e.message)}</div>`;
 }
}

async function loadAdminData(){
 const r=await api("adminData",{token:TOKEN});
 if(!r.ok)throw new Error(r.error||"Cannot load admin data");
 ADMIN_DATA=r;
}
async function loadApprovedCenters(){
 const r=await api("reportCenters",{token:TOKEN});
 if(!r.ok)throw new Error(r.error||"Cannot load centers");
 APPROVED_CENTERS=r.centers||[];
}
function centerNames(){return (ADMIN_DATA?.centers||[]).filter(c=>c.status==="APPROVED").map(c=>c.name).filter(Boolean)}
function approvedNames(){return APPROVED_CENTERS.filter(Boolean)}
function statusTag(status){
 const s=String(status||"PENDING").toUpperCase();
 return `<span class="tag ${s==="APPROVED"?"approved":s==="BLOCKED"?"blocked":"pending"}">${escapeHTML(s)}</span>`;
}

/* CATEGORY CARDS */

function categoryCard(name,icon,css,value,id){
 const amount=id
  ?`<input id="${id}" type="number" min="0" step="0.01" placeholder="0.00" inputmode="decimal">`
  :`<div class="amount">${money(value)}</div>`;

 return `<div class="category-card ${css}">
  <div><div class="cat-icon">${icon}</div><div class="cat-name">${name}</div></div>
  ${amount}
 </div>`;
}
function stakeInputCards(prefix=""){
 return `<div class="category-grid">
  ${categoryCard("AUSTRALIAN","🇦🇺","cat-australian",0,prefix+"australian")}
  ${categoryCard("ENGLAND","🏴","cat-england",0,prefix+"england")}
  ${categoryCard("TRACKSIDE","🏇","cat-trackside",0,prefix+"trackside")}
  ${categoryCard("DUE","💰","cat-due",0,prefix+"due")}
 </div>`;
}
function stakeValueCards(data){
 const x=data||{};
 return `<div class="category-grid">
  ${categoryCard("AUSTRALIAN","🇦🇺","cat-australian",x.australian)}
  ${categoryCard("ENGLAND","🏴","cat-england",x.england)}
  ${categoryCard("TRACKSIDE","🏇","cat-trackside",x.trackside)}
  ${categoryCard("DUE","💰","cat-due",x.due)}
 </div>
 <div class="category-card cat-total">
  <div><div class="cat-icon">💎</div><div class="cat-name">TOTAL • DUE EXCLUDED</div></div>
  <div class="amount">${money(x.total)}</div>
 </div>`;
}
function sumRows(rows){
 const s={australian:0,england:0,trackside:0,due:0,total:0};
 (rows||[]).forEach(r=>{
  Object.keys(s).forEach(k=>s[k]+=Number(r[k]||0));
 });
 return s;
}

/* DASHBOARDS */

async function dashboardPage(){
 if(ROLE==="ADMIN2"){
  await loadAdminData();

  const cs=ADMIN_DATA.centers||[];
  const approved=cs.filter(c=>c.status==="APPROVED").length;
  const pending=cs.filter(c=>c.status==="PENDING").length;
  const blocked=cs.filter(c=>c.status==="BLOCKED").length;

  $("content").innerHTML=`
   <h2>Admin 2 Dashboard</h2>
   <div class="grid">
    <div class="stat"><small>REGISTERED CENTERS</small><b>${cs.length}</b></div>
    <div class="stat"><small>APPROVED CENTERS</small><b>${approved}</b></div>
    <div class="stat"><small>PENDING APPROVALS</small><b>${pending}</b></div>
    <div class="stat"><small>BLOCKED CENTERS</small><b>${blocked}</b></div>
    <div class="stat"><small>REGISTERED DEVICES</small><b>${ADMIN_DATA.devices.length}</b></div>
    <div class="stat"><small>MAINTENANCE</small><b>${ADMIN_DATA.maintenance?"ON":"OFF"}</b></div>
   </div>
   <div class="panel" style="margin-top:14px">
    <h3>SYSTEM CONTROL</h3>
    <button class="btn" onclick="openPage('system')">SYSTEM ACCESS</button>
    <button class="btn gray" onclick="openPage('centers')">CENTER MANAGEMENT</button>
    <button class="btn gray" onclick="openPage('devices')">DEVICE MANAGEMENT</button>
   </div>`;
  return;
 }

 if(ROLE==="CENTER"){
  const r=await api("history",{token:TOKEN,date:todayISO()});
  if(!r.ok)throw new Error(r.error||"Could not load dashboard");

  const sums=sumRows(r.rows);

  $("content").innerHTML=`
   <h2>${escapeHTML(CENTER)} Dashboard</h2>
   <div class="report-head">
    <b>${escapeHTML(CENTER)}</b>
    <div class="muted">BUSINESS DATE: ${todayISO()}</div>
   </div>
   ${stakeValueCards(sums)}
   <button class="btn" onclick="openPage('newstake')">ADD NEW STAKE</button>
   <button class="btn gray" onclick="openPage('records')">VIEW RECORDS</button>`;
 }
}

/* ADMIN 2 PAGES */

async function systemPage(){
 await loadAdminData();
 const on=!!ADMIN_DATA.maintenance;

 $("content").innerHTML=`
  <h2>System Access</h2>
  <div class="panel">
   <h3>MAINTENANCE CONTROL</h3>
   <div class="notice ${on?"error":"success"}">SYSTEM STATUS: <b>${on?"UNDER MAINTENANCE":"ACTIVE"}</b></div>
   <button class="btn ${on?"green":"red"}" onclick="setMaintenance('${on?"OFF":"ON"}')">
    TURN MAINTENANCE ${on?"OFF":"ON"}
   </button>
  </div>
  <div class="panel">
   <h3>CENTER ACCESS SUMMARY</h3>

  </div>

function clearStakeFields(){
 ["australian","england","trackside","due"].forEach(id=>$(id).value="");
}

async function saveStake(){
 if(ROLE!=="CENTER")return;

 const date=$("stakeDate").value;
 if(!date){$("saveMessage").innerHTML='<div class="notice error">Select stake date.</div>';return}

 const data={
  token:TOKEN,date:date,
  australian:$("australian").value||0,
  england:$("england").value||0,
  trackside:$("trackside").value||0,
  due:$("due").value||0
 };

 $("saveMessage").innerHTML='<div class="notice">Saving...</div>';

 try{
  const r=await api("save",data);

  if(!r.ok){
   $("saveMessage").innerHTML=`<div class="notice error">${escapeHTML(r.error||"Save failed")}</div>`;
   return;
  }

  $("saveMessage").innerHTML=
   `<div class="notice success">Stake saved successfully. Date: ${escapeHTML(r.date)} • Total: ${money(r.total)}</div>`;

  clearStakeFields();
 }catch(e){
  $("saveMessage").innerHTML=`<div class="notice error">${escapeHTML(e.message)}</div>`;
 }
}

async function loadRequestTargets(){
 const select=$("requestTarget");
 if(!select)return;

 try{
  const r=await api("centerTargets",{token:TOKEN});
  if(!r.ok){
   select.innerHTML='<option value="">Could not load centers</option>';
   return;
  }

  select.innerHTML='<option value="">Select another center</option>'+
   (r.centers||[]).map(n=>`<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join("");
 }catch(e){
  if(select)select.innerHTML='<option value="">Could not load centers</option>';
 }
}

async function sendOtherRequest(){
 const targetCenter=$("requestTarget").value;
 if(!targetCenter){alert("Select target center.");return}

 const data={
  token:TOKEN,targetCenter,date:$("requestDate").value,
  australian:$("request_australian").value||0,
  england:$("request_england").value||0,
  trackside:$("request_trackside").value||0,
  due:$("request_due").value||0
 };

 $("requestMessageResult").innerHTML='<div class="notice">Sending request...</div>';

 try{
  const r=await api("otherRequestSend",data);
  $("requestMessageResult").innerHTML=r.ok?
   '<div class="notice success">Request sent to Admin 2 successfully.</div>':
   `<div class="notice error">${escapeHTML(r.error||"Request failed")}</div>`;
 }catch(e){
  $("requestMessageResult").innerHTML=`<div class="notice error">${escapeHTML(e.message)}</div>`;
 }
}

async function loadReport(){
 if(ROLE!=="ADMIN1")return;

 const date=$("reportDate")?.value||todayISO();
 const center=$("reportCenter")?.value||"ALL";

 $("reportResult").innerHTML='<div class="notice">Loading report...</div>';

 const r=await api("report",{token:TOKEN,date,center});

 if(!r.ok){
  $("reportResult").innerHTML=`<div class="notice error">${escapeHTML(r.error||"Report loading failed")}</div>`;
  return;
 }

 const rows=r.rows||[];
 const total=r.total||{};
 let cards="";

 if(center==="ALL"){
  cards=rows.map(x=>`
   <div class="panel">
    <div class="report-head"><b>${escapeHTML(x.center)}</b><div>${escapeHTML(date)}</div></div>
    ${stakeValueCards(x)}
   </div>`).join("");
 }else{
  const x=rows[0]||{australian:0,england:0,trackside:0,due:0,total:0};
  cards=`
   <div class="report-head"><b>${escapeHTML(center)}</b><div>BUSINESS DATE: ${escapeHTML(date)}</div></div>
   ${stakeValueCards(x)}`;
 }

 $("reportResult").innerHTML=`
  <div class="panel">
   <div class="row">
    <h3>REPORT PREVIEW</h3>
    <button class="btn screenshot-btn small" onclick="takeReportScreenshot()">📸 SCREENSHOT</button>
   </div>
   <div id="reportCapture" class="report-capture">
    <div class="report-head">
     <h2>DAILY STAKE REPORT</h2>
     <div>MULTI CENTER MANAGEMENT SYSTEM</div>
     <div>BUSINESS DATE: ${escapeHTML(date)}</div>
     <div>CENTER: ${escapeHTML(center==="ALL"?"ALL CENTERS":center)}</div>
    </div>
    ${cards||'<div class="notice">No report data found.</div>'}
    ${center==="ALL"?`
     <div class="category-card cat-total">
      <div><div class="cat-icon">💎</div><div class="cat-name">GRAND TOTAL • DUE EXCLUDED</div></div>
      <div class="amount">${money(total.total)}</div>
     </div>`:""}
    <div style="font-size:10px;color:#aa9bbd;margin-top:16px;text-align:center">
     DAILY STAKE • ${escapeHTML(date)}
    </div>
   </div>
  </div>`;
}

async function takeReportScreenshot(){
 if(ROLE!=="ADMIN1")return;

 const target=$("reportCapture");
 if(!target){alert("Load a report first.");return}

 if(!window.html2canvas){
  alert("Screenshot tool is still loading. Try again.");
  return;
 }

 try{
  const canvas=await html2canvas(target,{
   scale:2,backgroundColor:"#090711",useCORS:true
  });

  const link=document.createElement("a");
  link.download="Daily-Stake-"+$("reportCenter").value+"-"+$("reportDate").value+".png";
  link.href=canvas.toDataURL("image/png");
  link.click();
 }catch(e){
  alert("Screenshot failed: "+e.message);
 }
}

async function enterRequest(id,center,date,australian,england,trackside,due){

 const r=await api("manualSave",{
  token:TOKEN,center,date,australian,england,trackside,due
 });

 if(!r.ok){alert(r.error||"Could not save request");return}

 const marked=await api("markRequestEntered",{token:TOKEN,id});
 if(!marked.ok){alert("Stake saved, but request status could not be updated.");return}

 alert("Request stake saved successfully.");
 await requestsPage();
}

async function messagesPage(){
 const isAdmin=ROLE==="ADMIN1"||ROLE==="ADMIN2";

 if(isAdmin){
  if(ROLE==="ADMIN2")await loadAdminData();
  else await loadApprovedCenters();

  const names=ROLE==="ADMIN2"?centerNames():approvedNames();

  $("content").innerHTML=`
   <h2>Private Messages</h2>
   <label class="muted">Select Center</label>
   <select id="chatCenter" onchange="loadMessages()">
    ${names.map(n=>`<option value="${escapeHTML(n)}">${escapeHTML(n)}</option>`).join("")}
   </select>
   <div id="chatArea"></div>`;
 }else{
  $("content").innerHTML=`
   <h2>Private Messages</h2>
   <div class="notice">Send a private message to Admin 1 or Admin 2.</div>
   <label class="muted">Send To</label>
   <select id="chatTarget">
    <option value="ADMIN1">Admin 1</option>
    <option value="ADMIN2">Admin 2</option>
   </select>
   <div id="chatArea"></div>`;
 }

 await loadMessages();
 CHAT_TIMER=setInterval(()=>loadMessages(true),15000);
}

async function loadMessages(silent=false){
 const isAdmin=ROLE==="ADMIN1"||ROLE==="ADMIN2";
 const center=isAdmin?($("chatCenter")?.value||""):CENTER;

 if(!center)return;

 const r=await api("chatGet",{token:TOKEN,center});

 if(!r.ok){
  if(!silent)$("chatArea").innerHTML=`<div class="notice error">${escapeHTML(r.error||"Messages unavailable")}</div>`;
  return;
 }

 const msgs=r.messages||[];
 const html=msgs.map(m=>`
  <div class="item">
   <b>${escapeHTML(m.senderRole||"Message")} → ${escapeHTML(m.recipientRole||"")}</b>
   <div style="margin-top:6px">${escapeHTML(m.message)}</div>
   <div class="muted">${escapeHTML(m.sentAt)}</div>
  </div>`).join("");

 $("chatArea").innerHTML=`
  <div class="panel" style="max-height:340px;overflow:auto">${html||'<div class="muted">No messages yet.</div>'}</div>
  <textarea id="chatMessage" rows="3" placeholder="Type your message..."></textarea>
  <button class="btn" onclick="sendMessage()">SEND MESSAGE</button>`;
}

async function sendMessage(){
 const message=$("chatMessage").value.trim();
 if(!message)return;

 const isAdmin=ROLE==="ADMIN1"||ROLE==="ADMIN2";
 const data={token:TOKEN,message};

 if(isAdmin)data.center=$("chatCenter").value;
 else data.recipientRole=$("chatTarget").value;

 const r=await api("chatSend",data);
 if(!r.ok){alert(r.error||"Message could not be sent");return}

 await loadMessages();
}
